# Variables de entorno compartidas entre los servicios `app` y `scheduler`.
# Editar aqui una sola vez: ambos servicios usan el mismo origen (evita drift).
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  # Se pasan al entrypoint para que ajuste APP_URL y SANCTUM_STATEFUL_DOMAINS
  # con el host:puerto correcto (el bug del puerto de Sanctum en SPA auth).
  APP_PORT: ${APP_PORT:-8080}
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  DB_HOST: database
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-redprint}
  DB_USERNAME: ${DB_USERNAME:-redprint}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

services:
  # --- Builder del frontend (se ejecuta una sola vez y termina) -----------------
  # Compila la SPA React/Vite dentro de Docker. Asi NO hace falta tener Node/npm
  # instalado en el host: con "docker compose up" el dist queda listo para nginx.
  # Si frontend/dist ya existe (build previo / hecho a mano), se omite.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -f dist/index.html ]; then echo '[frontend] npm install + build'; npm install --no-audit --no-fund && npm run build; else echo '[frontend] dist ya existe, omito build'; fi"
    volumes:
      - ./frontend:/app

  app:
    image: redprint-app:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redprint-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - app_storage:/var/www/html/storage
    environment:
      <<: *app-env
      # Solo `app` corre las migraciones (el scheduler las omite, ver abajo).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Confirma que php-fpm ya esta escuchando (arranca despues del entrypoint:
      # composer install + migrate + seed). Evita 502 en nginx en el primer up.
      # Los '$$' se escapan para que compose no los interprete como variables.
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000,$$e,$$m,2);exit($$s?0:1);'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks:
      - redprint

  scheduler:
    image: redprint-app:${TAG:-latest}
    container_name: redprint-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - app_storage:/var/www/html/storage
    environment:
      <<: *app-env
      # El scheduler NO migra: `app` ya lo hizo y esta sano (service_healthy).
      RUN_MIGRATIONS: "0"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - redprint

  database:
    image: postgres:16-alpine
    container_name: redprint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-redprint}
      POSTGRES_USER: ${DB_USERNAME:-redprint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-redprint} -d ${DB_DATABASE:-redprint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redprint

  nginx:
    image: nginx:alpine
    container_name: redprint-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        # nginx no arranca hasta que el frontend este compilado (evita el 403).
        condition: service_completed_successfully
    networks:
      - redprint

volumes:
  pg_data:
  app_storage:

networks:
  redprint:
    driver: bridge
